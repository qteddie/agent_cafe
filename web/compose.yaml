# Agent Café's web page, and a Cloudflare tunnel that puts it on your domain.
#
#   cd web
#   cp .env.example .env                           # then fill it in
#   docker compose up -d --build                   # the page, on http://localhost:8080
#   docker compose --profile tunnel up -d --build  # and on your domain, through the tunnel
#
# The tunnel runs from its token alone, CLOUDFLARE_TUNNEL_TOKEN in .env. Which
# hostname it serves is set on Cloudflare, in the tunnel's routes: give the
# hostname (cafe.your-domain.com, say) the service URL http://cafe:8080.
#   - `cafe`, not `localhost`: in the tunnel's container, localhost is the
#     tunnel itself. `cafe` is the page's container, by its name below.
#   - `http`, not `https`: the page speaks no https of its own, and an https
#     service URL gets a 502. Cloudflare serves your domain over https all the same.

name: agent-cafe

services:
  cafe:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: agent-cafe
    restart: unless-stopped
    environment:
      CAFE_INGEST_KEY: ${CAFE_INGEST_KEY:?set CAFE_INGEST_KEY in web/.env}
      CAFE_VIEW_KEY: ${CAFE_VIEW_KEY:?set CAFE_VIEW_KEY in web/.env}
      TZ: ${TZ:-Asia/Taipei}
      CAFE_DEBUG: ${CAFE_DEBUG:-}
    ports:
      # This machine only: the world comes in through the tunnel.
      - "127.0.0.1:8080:8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agent-cafe-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # cloudflared takes its token from here, so it is on no command line.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - cafe
    profiles:
      - tunnel
