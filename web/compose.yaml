# Agent Café's web page, and a Cloudflare tunnel that puts it on your domain.
#
#   cd web
#   cp .env.example .env                           # then fill it in
#   docker compose up -d --build                   # the page, on http://localhost:8787
#   docker compose --profile tunnel up -d --build  # and on your domain, through the tunnel
#
# In the tunnel's settings on Cloudflare, point the public hostname
# (cafe.your-domain.com, say) at http://cafe:8787.

name: agent-cafe

services:
  cafe:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: agent-cafe
    restart: unless-stopped
    environment:
      CAFE_INGEST_KEY: ${CAFE_INGEST_KEY:?set CAFE_INGEST_KEY in web/.env}
      CAFE_VIEW_KEY: ${CAFE_VIEW_KEY:?set CAFE_VIEW_KEY in web/.env}
      TZ: ${TZ:-Asia/Taipei}
    ports:
      # This machine only: the world comes in through the tunnel.
      - "127.0.0.1:8787:8787"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agent-cafe-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - cafe
    profiles:
      - tunnel
